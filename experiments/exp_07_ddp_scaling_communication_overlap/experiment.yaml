schema_version: 1

experiment:
  id: EXP-07
  slug: ddp_scaling_communication_overlap
  title: DDP scaling and communication overlap
  status: design
  catalog: ../../EXPERIMENT_CATALOG.md

stack:
  family: pytorch
  image: 037678282394.dkr.ecr.us-west-2.amazonaws.com/multi-gpu-training-pytorch@sha256:8f7e455bc939e95bd795bbe569224cd2728903324324df7f60dcbffc9af38486

hardware:
  compute_profile: AWS-A2
  provider: aws
  location: us-west-2
  resource_type: g7e.12xlarge
  purchase_option: on-demand
  gpu_type: RTX PRO 6000 Blackwell Server Edition
  gpu_architecture: Blackwell SM 12.0
  gpu_memory_gib: 96
  physical_gpu_count: 2
  visible_gpu_count: null
  visible_devices: []
  single_node: true

qualification:
  required: true
  command: infra/aws/exp01_preflight.py --config infra/aws/exp01_qualification.yaml

workload:
  shared_config: null
  profile: benchmark
  overrides:
    input_lock: ../../configs/inputs.lock.yaml
    model_id: Qwen/Qwen3-1.7B-Base
    model_revision: ea980cb0a6c2ae4b936e82123acc929f1cec04c1
    dataset_id: Salesforce/wikitext
    dataset_configuration: wikitext-103-raw-v1
    dataset_revision: b08601e04326c79dfdd32d625aee71d232d685c3
    preprocessing_version: qwen3-wikitext-v1
    training_mode: full_parameter_continued_pretraining
    objective: causal_next_token_cross_entropy
    precision: bf16_candidate
    sequence_length: 1024
    warmup_optimizer_steps: 5
    measured_optimizer_steps: 30
    restore_checkpoint_between_variants: true

sweep:
  baseline: EXP-07-A2V1-one-rank-baseline
  variants:
    - id: EXP-07-A2V1-one-rank-fixed-local
      run_unit: EXP-07-A2V1
      visible_devices: [0]
      world_size: 1
      per_rank_microbatch_size: 1
      gradient_accumulation_steps: 1
      effective_global_batch_size: 1
      view: one_rank_baseline
    - id: EXP-07-A2V2-two-rank-fixed-local
      run_unit: EXP-07-A2V2
      visible_devices: [0, 1]
      world_size: 2
      per_rank_microbatch_size: 1
      gradient_accumulation_steps: 1
      effective_global_batch_size: 2
      view: weak_scaling
    - id: EXP-07-A2V2-two-rank-fixed-global
      run_unit: EXP-07-A2V2
      visible_devices: [0, 1]
      world_size: 2
      per_rank_microbatch_size: 1
      gradient_accumulation_steps: 1
      effective_global_batch_size: 2
      view: strong_scaling_guarded
      note: Global batch is held at the smallest feasible common batch for this model and profile.
    - id: EXP-07-A2V2-two-rank-bucket-small
      run_unit: EXP-07-A2V2
      visible_devices: [0, 1]
      world_size: 2
      bucket_cap_mb: 10
      view: bucket_sensitivity
    - id: EXP-07-A2V2-two-rank-bucket-default
      run_unit: EXP-07-A2V2
      visible_devices: [0, 1]
      world_size: 2
      bucket_cap_mb: 25
      view: bucket_sensitivity
    - id: EXP-07-A2V2-two-rank-bucket-large
      run_unit: EXP-07-A2V2
      visible_devices: [0, 1]
      world_size: 2
      bucket_cap_mb: 100
      view: bucket_sensitivity
    - id: EXP-07-A2V2-two-rank-no-sync-accumulation
      run_unit: EXP-07-A2V2
      visible_devices: [0, 1]
      world_size: 2
      per_rank_microbatch_size: 1
      gradient_accumulation_steps: 4
      synchronization: no_sync_until_optimizer_step
      view: local_accumulation
  fixed:
    host_profile: AWS-A2
    physical_instance_type: g7e.12xlarge
    single_node: true
    seeds: [1337, 1338, 1339]
    precision: BF16 candidate unless EXP-02 invalidates it
    optimizer: same settings across comparable variants

execution:
  launcher: python experiments/exp_07_ddp_scaling_communication_overlap/run_exp07.py --execute
  planning_command: python experiments/exp_07_ddp_scaling_communication_overlap/run_exp07.py --dry-run
  environment:
    NCCL_DEBUG: INFO
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
  timeout_seconds: 7200

measurements:
  required:
    - immutable image digest
    - driver, CUDA, PyTorch, and NCCL versions
    - GPU visibility and topology
    - tokens per second and optimizer step time
    - speedup and scaling efficiency
    - peak allocated and reserved GPU memory per rank
    - all-reduce time
    - backward and communication overlap
    - bucket readiness and bucket size
    - loss equivalence across comparable variants
  profilers:
    - torch-profiler
    - nsight-systems-optional
    - nvidia-smi
  repetitions: 3

correctness:
  gates:
    - mandatory AWS-A2 qualification passes
    - one-rank and two-rank variants use the same model, inputs, seed, and optimizer settings
    - DDP world size matches visible GPU count
    - all ranks complete the same number of optimizer steps
    - final loss is finite on every rank
    - comparable variants agree within the EXP-07 tolerance defined before launch
    - no_sync variants synchronize gradients before every optimizer step

outputs:
  root: ../../artifacts/runs
  durable_uri: s3://finetuning-lab-1-037678282394-us-west-2-an/artifacts/EXP-07/
  preserve_raw: true
  preserve_profiles: true

budget:
  maximum_active_gpu_hours: 4.0
  maximum_instance_hours: 2.0
  maximum_provider_cost: 20.0
  stop_conditions:
    - qualification fails
    - immutable EXP-07-capable image digest is missing
    - input manifest verification fails
    - any required artifact stage-out fails
    - bounded run timeout is reached
