schema_version: 1

experiment:
  id: EXP-14
  slug: tp2_dp2_hybrid
  title: TP=2 x DP=2 for model width and throughput
  status: design
  catalog: ../../EXPERIMENT_CATALOG.md

stack:
  family: nemo-megatron
  image: ghcr.io/helian2s/multi-gpu-training-nemo@sha256:c2713c9027894f03d4da724cca04cc51256cec4bdc4b1f42b63578ff6133ac3b

hardware:
  compute_profile: RUNPOD-A100-SXM4
  provider: runpod
  location: selected-at-launch
  resource_type: secure-cloud-pod
  purchase_option: on-demand
  gpu_type: NVIDIA A100-SXM4-80GB
  gpu_architecture: Ampere SM 8.0
  gpu_memory_gib: 80
  physical_gpu_count: 4
  visible_gpu_count: 4
  visible_devices: [0, 1, 2, 3]
  single_node: true
  interconnect: nvlink_required

qualification:
  required: true
  command: python common/qualification/runpod_gpu_smoke.py --execute --expected-devices 4

workload:
  shared_config: null
  profile: benchmark
  overrides:
    model_family: synthetic_transformer_mlp
    framework: NeMo/Megatron Core runtime
    training_mode: synthetic_full_backward_step
    objective: hybrid_tp_dp_rank_map_measurement
    precision: bf16
    restore_checkpoint_between_variants: false

sweep:
  baseline: EXP-14-RUNPOD-A4-dp4
  variants:
    - id: EXP-14-RUNPOD-A4-dp4
      run_unit: EXP-14-RUNPOD-A4-Megatron
      visible_devices: [0, 1, 2, 3]
      world_size: 4
      workload: hybrid_tp_dp_benchmark
      layout: dp4
      tensor_parallel_size: 1
      data_parallel_size: 4
      microbatch_size: 1
      sequence_length: 512
      hidden_size: 1024
      mlp_expansion: 4
      precision: bf16
      warmup_steps: 1
      measured_steps: 6
      view: data_parallel_four_replicas
    - id: EXP-14-RUNPOD-A4-tp4
      run_unit: EXP-14-RUNPOD-A4-Megatron
      visible_devices: [0, 1, 2, 3]
      world_size: 4
      workload: hybrid_tp_dp_benchmark
      layout: tp4
      tensor_parallel_size: 4
      data_parallel_size: 1
      microbatch_size: 1
      sequence_length: 512
      hidden_size: 1024
      mlp_expansion: 4
      precision: bf16
      warmup_steps: 1
      measured_steps: 6
      view: tensor_parallel_four_shards
    - id: EXP-14-RUNPOD-A4-tp2-dp2
      run_unit: EXP-14-RUNPOD-A4-Megatron
      visible_devices: [0, 1, 2, 3]
      world_size: 4
      workload: hybrid_tp_dp_benchmark
      layout: tp2_dp2
      tensor_parallel_size: 2
      data_parallel_size: 2
      microbatch_size: 1
      sequence_length: 512
      hidden_size: 1024
      mlp_expansion: 4
      precision: bf16
      warmup_steps: 1
      measured_steps: 6
      view: hybrid_tensor_data_parallel
  fixed:
    host_profile: RUNPOD-A100-SXM4
    physical_gpu_count: 4
    visible_gpu_count: 4
    single_node: true
    seeds: [1337]
    precision: BF16
    optimizer: AdamW with identical synthetic shard parameters per variant

execution:
  launcher: python experiments/exp_14_tp2_dp2_hybrid/run_exp14.py --execute
  planning_command: python experiments/exp_14_tp2_dp2_hybrid/run_exp14.py --dry-run --allow-unpublished-image
  environment:
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
    NCCL_DEBUG: INFO
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  timeout_seconds: 7200

measurements:
  required:
    - immutable GHCR image digest
    - driver, CUDA, PyTorch, NCCL, NeMo, Megatron Core, and Megatron Bridge versions
    - GPU visibility and topology
    - DP=4 rank map, step time, memory, and DP gradient traffic
    - TP=4 rank map, step time, memory, and TP activation traffic
    - TP=2 x DP=2 rank map, step time, memory, TP traffic, and DP traffic
    - per-rank peak allocated GPU memory
  profilers: []
  repetitions: 1

correctness:
  gates:
    - mandatory Runpod A4 qualification passes
    - NeMo/Megatron image imports Megatron Core modules
    - world size is exactly 4
    - rank maps match the declared DP=4, TP=4, and TP=2 x DP=2 layouts
    - every variant writes rank metrics and a manifest

outputs:
  root: ../../artifacts/runs
  durable_uri: runpod-network-volume:/artifacts/EXP-14/
  preserve_raw: true
  preserve_profiles: true

budget:
  maximum_active_gpu_hours: 3.0
  maximum_instance_hours: 1.0
  maximum_provider_cost: null
  stop_conditions:
    - qualification fails
    - immutable Runpod NeMo image digest is missing
    - Megatron Core modules are unavailable
    - bounded run timeout is reached
