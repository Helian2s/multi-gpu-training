schema_version: 1

experiment:
  id: EXP-08
  slug: fsdp_sharding_zero_memory_tradeoffs
  title: FSDP sharding and ZeRO-style memory trade-offs
  status: design
  catalog: ../../EXPERIMENT_CATALOG.md

stack:
  family: pytorch
  image: 037678282394.dkr.ecr.us-west-2.amazonaws.com/multi-gpu-training-pytorch@sha256:8f7e455bc939e95bd795bbe569224cd2728903324324df7f60dcbffc9af38486

hardware:
  compute_profile: AWS-A2
  provider: aws
  location: us-west-2
  resource_type: g7e.12xlarge
  purchase_option: on-demand
  gpu_type: RTX PRO 6000 Blackwell Server Edition
  gpu_architecture: Blackwell SM 12.0
  gpu_memory_gib: 96
  physical_gpu_count: 2
  visible_gpu_count: 2
  visible_devices: [0, 1]
  single_node: true

qualification:
  required: true
  command: infra/aws/exp01_preflight.py --config infra/aws/exp01_qualification.yaml

workload:
  shared_config: null
  profile: benchmark
  overrides:
    input_lock: ../../configs/inputs.lock.yaml
    model_id: Qwen/Qwen3-1.7B-Base
    model_revision: ea980cb0a6c2ae4b936e82123acc929f1cec04c1
    dataset_id: Salesforce/wikitext
    dataset_configuration: wikitext-103-raw-v1
    dataset_revision: b08601e04326c79dfdd32d625aee71d232d685c3
    preprocessing_version: qwen3-wikitext-v1
    training_mode: full_parameter_continued_pretraining
    objective: causal_next_token_cross_entropy
    precision: bf16_candidate
    sequence_length: 1024
    warmup_optimizer_steps: 5
    measured_optimizer_steps: 20
    restore_checkpoint_between_variants: true

sweep:
  baseline: EXP-08-A2V2-ddp-replicated-baseline
  variants:
    - id: EXP-08-A2V2-ddp-replicated-baseline
      run_unit: EXP-08-A2V2
      visible_devices: [0, 1]
      world_size: 2
      strategy: ddp
      sharding: none
    - id: EXP-08-A2V2-fsdp-shard-grad-optim
      run_unit: EXP-08-A2V2
      visible_devices: [0, 1]
      world_size: 2
      strategy: fsdp
      sharding: gradients_and_optimizer_state
      fsdp_api: prefer_fsdp2_when_available
    - id: EXP-08-A2V2-fsdp-full-shard
      run_unit: EXP-08-A2V2
      visible_devices: [0, 1]
      world_size: 2
      strategy: fsdp
      sharding: parameters_gradients_and_optimizer_state
      fsdp_api: prefer_fsdp2_when_available
    - id: EXP-08-A2V2-fsdp-full-shard-prefetch
      run_unit: EXP-08-A2V2
      visible_devices: [0, 1]
      world_size: 2
      strategy: fsdp
      sharding: parameters_gradients_and_optimizer_state
      prefetch: enabled
      admission_gate: correct_full_shard_baseline_passes
  fixed:
    host_profile: AWS-A2
    physical_instance_type: g7e.12xlarge
    single_node: true
    seeds: [1337, 1338, 1339]
    precision: BF16 candidate unless EXP-02 invalidates it
    optimizer: same settings across comparable variants
    model_size: fixed; do not manufacture OOM by changing the model

execution:
  launcher: python experiments/exp_08_fsdp_sharding_zero_memory_tradeoffs/run_exp08.py --execute
  planning_command: python experiments/exp_08_fsdp_sharding_zero_memory_tradeoffs/run_exp08.py --dry-run
  environment:
    NCCL_DEBUG: INFO
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
  timeout_seconds: 5400

measurements:
  required:
    - immutable image digest
    - driver, CUDA, PyTorch, and NCCL versions
    - GPU visibility and topology
    - initialization time
    - model-state memory by category when available
    - peak allocated and reserved GPU memory per rank
    - all-gather and reduce-scatter traffic
    - tokens per second and optimizer step time
    - checkpoint size and state-dict save/load behavior
    - loss agreement with DDP baseline
  profilers:
    - torch-profiler
    - nsight-systems-optional
    - nvidia-smi
  repetitions: 3

correctness:
  gates:
    - mandatory AWS-A2 qualification passes
    - DDP baseline completes first with finite loss on both ranks
    - FSDP API choice and fallback reason are recorded
    - every FSDP variant completes forward, backward, optimizer step, and checkpoint round trip
    - compared variants restore the same checkpoint and input batches
    - final loss agrees with DDP baseline within the EXP-08 tolerance defined before launch
    - no model-size change is used to create an artificial OOM result

outputs:
  root: ../../artifacts/runs
  durable_uri: s3://finetuning-lab-1-037678282394-us-west-2-an/artifacts/EXP-08/
  preserve_raw: true
  preserve_profiles: true

budget:
  maximum_active_gpu_hours: 2.0
  maximum_instance_hours: 1.0
  maximum_provider_cost: 12.0
  stop_conditions:
    - qualification fails
    - immutable EXP-08-capable image digest is missing
    - input manifest verification fails
    - any required artifact stage-out fails
    - bounded run timeout is reached
