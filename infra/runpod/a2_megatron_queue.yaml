schema_version: 1
queue:
  id: RUNPOD-A2-Megatron
  description: Sequential two-GPU Runpod queue for EXP-10, EXP-11, and EXP-13.
  compute_profile: RUNPOD-A100-SXM2
  container_queue_config: infra/runpod/a2_megatron_queue.yaml
  expected_run_units:
    - QUAL-RUNPOD-A2-Megatron
    - EXP-10-RUNPOD-A2-Megatron
    - EXP-11-RUNPOD-A2-Megatron-V1
    - EXP-11-RUNPOD-A2-Megatron-V2
    - EXP-13-RUNPOD-A2-Megatron-V1
    - EXP-13-RUNPOD-A2-Megatron-V2
  maximum_lifetime_minutes: 360
  post_queue_inspection_minutes: 15
  stop_on_success: true
  stop_on_failure: false

runpod:
  cloud_type: SECURE
  gpu_id: NVIDIA A100-SXM4-80GB
  gpu_count: 2
  min_cuda_version: "12.8"
  data_center_ids: []
  container_disk_gb: 120
  pod_volume_gb: 50
  network_volume_mount_path: /runpod-volume
  network_volume_id: ""
  ports:
    - 22/tcp
  registry_auth_id: cmrmgu74b005rha4eqqn8bsoo

image:
  registry: ghcr.io
  repository: helian2s/multi-gpu-training-nemo
  tag: runpod-cuda128-20260715-0900943-dirty
  digest: sha256:c2713c9027894f03d4da724cca04cc51256cec4bdc4b1f42b63578ff6133ac3b

artifacts:
  network_volume_root: /runpod-volume/artifacts/runs

container:
  repo_root: /workspace/multi-gpu-training
  environment:
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
    NCCL_DEBUG: INFO
    NCCL_DEBUG_SUBSYS: INIT,COLL,GRAPH
    TOKENIZERS_PARALLELISM: "false"
    TORCH_DISTRIBUTED_DEBUG: DETAIL
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"

run_units:
  - run_unit: QUAL-RUNPOD-A2-Megatron
    experiment_id: QUAL-RUNPOD-A2-Megatron
    kind: shell
    visible_devices: "0,1"
    command:
      - python
      - common/qualification/runpod_gpu_smoke.py
      - --execute
      - --expected-devices
      - "2"
    timeout_seconds: 1200
  - run_unit: EXP-10-RUNPOD-A2-Megatron
    experiment_id: EXP-10
    kind: shell
    visible_devices: "0,1"
    command:
      - bash
      - experiments/exp_10_runpod_nvlink_p2p_nccl_communication/collect_exp10.sh
    timeout_seconds: 5400
  - run_unit: EXP-11-RUNPOD-A2-Megatron-V1
    experiment_id: EXP-11
    kind: runner
    visible_devices: "0"
    runner: experiments/exp_11_tensor_sequence_parallelism/run_exp11.py
    timeout_seconds: 5400
  - run_unit: EXP-11-RUNPOD-A2-Megatron-V2
    experiment_id: EXP-11
    kind: runner
    visible_devices: "0,1"
    runner: experiments/exp_11_tensor_sequence_parallelism/run_exp11.py
    timeout_seconds: 5400
  - run_unit: EXP-13-RUNPOD-A2-Megatron-V1
    experiment_id: EXP-13
    kind: runner
    visible_devices: "0"
    runner: experiments/exp_13_context_parallelism_long_sequences/run_exp13.py
    timeout_seconds: 5400
  - run_unit: EXP-13-RUNPOD-A2-Megatron-V2
    experiment_id: EXP-13
    kind: runner
    visible_devices: "0,1"
    runner: experiments/exp_13_context_parallelism_long_sequences/run_exp13.py
    timeout_seconds: 5400
